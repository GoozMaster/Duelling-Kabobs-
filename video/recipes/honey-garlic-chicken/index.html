    <script>
      (() => {
        const TL = window.TL;
        const B = TL.b;
        const C = {
          surface: "#fdf6e3", raised: "#ffffff", ink: "#16233f", muted: "#55617d", yellow: "#ffd90f",
          gold: "#f5a623", brick: "#a8382b", brickSoft: "#f8ddd6", teal: "#1f7a84", tealSoft: "#d8eff1",
          basil: "#2f7d4f", basilSoft: "#dcf0e2", sand: "#edcf9d",
          steel: "#dfe6ee", steelMid: "#c3ccd8", steelDark: "#8d99ab", well: "#2b3652",
          raw: "#f3c7a0", browned: "#b9652a", sauce: "#a4501d", glaze: "#c9742c",
        };
        const S = 7; // the keyline, at video scale
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => Array.from(document.querySelectorAll(sel));

        // Deterministic scatter, so every render is identical.
        let seed = 7;
        const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

        // ------------------------------------------------------------ pieces

        const hl = (text, size, extra = "") =>
          `<div class="hl" style="font-size:${size}px;--sw:${Math.max(6, size * 0.085).toFixed(1)}px;${extra}">${text}</div>`;

        const sunburst = (id, x, y, size = 2600, color = C.gold) => {
          const rays = Array.from({ length: 24 }, (_, i) => {
            const half = 15 * 0.46, a = 15 * i;
            const pt = (d) => `${(1000 * Math.cos((d * Math.PI) / 180)).toFixed(1)} ${(1000 * Math.sin((d * Math.PI) / 180)).toFixed(1)}`;
            return `<path d="M0 0 L${pt(a - half)} L${pt(a + half)} Z" fill="${color}" opacity="${i % 2 ? 0.3 : 0.16}"/>`;
          }).join("");
          return `<svg id="${id}" viewBox="-1000 -1000 2000 2000" style="position:absolute;left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px">${rays}</svg>`;
        };

        const drop = (fill) =>
          `<path d="M0 -52 C 26 -16 42 4 42 22 A42 42 0 0 1 -42 22 C -42 4 -26 -16 0 -52 Z" fill="${fill}" stroke="${C.ink}" stroke-width="${S}" stroke-linejoin="round"/>
           <ellipse cx="-14" cy="14" rx="8" ry="13" fill="#fff" opacity=".55"/>`;
        const leaves = (fill) =>
          [[-26, 6, -30], [0, -16, 0], [26, 6, 30]].map(([x, y, r]) =>
            `<path transform="translate(${x} ${y}) rotate(${r})" d="M0 -34 C 22 -18 22 18 0 34 C -22 18 -22 -18 0 -34 Z" fill="${fill}" stroke="${C.ink}" stroke-width="6" stroke-linejoin="round"/>`).join("") +
          `<path d="M0 46 L0 -4" stroke="${C.ink}" stroke-width="6" stroke-linecap="round"/>`;
        const garlic = () =>
          `<path d="M0 -50 C 8 -32 42 -20 42 12 C 42 40 22 50 0 50 C -22 50 -42 40 -42 12 C -42 -20 -8 -32 0 -50 Z" fill="#fbf3e4" stroke="${C.ink}" stroke-width="${S}" stroke-linejoin="round"/>
           <path d="M0 -30 C -14 -10 -16 30 -6 48 M0 -30 C 14 -10 16 30 6 48" fill="none" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/>`;

        const thighPath = "M-85 -20 C -80 -70 20 -78 72 -46 C 102 -25 97 32 60 52 C 10 78 -62 72 -82 36 C -92 15 -90 0 -85 -20 Z";
        const thigh = (cls = "", browned = false) => `
          <g class="${cls}">
            <path class="raw" d="${thighPath}" fill="${C.raw}" stroke="${C.ink}" stroke-width="${S}" stroke-linejoin="round" ${browned ? 'opacity="0"' : ""}/>
            <g class="brown" ${browned ? "" : 'opacity="0"'}>
              <path d="${thighPath}" fill="${C.browned}" stroke="${C.ink}" stroke-width="${S}" stroke-linejoin="round"/>
              <path d="M-50 -30 L 30 -44 M-60 2 L 50 -12 M-48 34 L 40 22" stroke="#7a3a12" stroke-width="9" stroke-linecap="round" opacity=".55"/>
              <ellipse cx="-30" cy="-36" rx="22" ry="8" fill="#fff" opacity=".35"/>
            </g>
          </g>`;

        /** The Instant Pot, front on, sitting with its base on y=900 around x=1390. */
        const pot = (id, { lid = false } = {}) => `
          <g id="${id}-pot">
            <ellipse cx="1390" cy="912" rx="290" ry="26" fill="${C.ink}" opacity=".15"/>
            <rect x="1168" y="852" width="444" height="54" rx="20" fill="${C.steelDark}" stroke="${C.ink}" stroke-width="${S}"/>
            <rect x="1112" y="506" width="62" height="38" rx="14" fill="${C.steelDark}" stroke="${C.ink}" stroke-width="${S}"/>
            <rect x="1606" y="506" width="62" height="38" rx="14" fill="${C.steelDark}" stroke="${C.ink}" stroke-width="${S}"/>
            <rect x="1150" y="470" width="480" height="400" rx="70" fill="${C.steel}" stroke="${C.ink}" stroke-width="${S}"/>
            <rect x="1184" y="512" width="30" height="310" rx="15" fill="#fff" opacity=".75"/>
            <ellipse cx="1390" cy="470" rx="250" ry="56" fill="${C.steelMid}" stroke="${C.ink}" stroke-width="${S}"/>
            <ellipse id="${id}-well" cx="1390" cy="470" rx="200" ry="38" fill="${C.well}" stroke="${C.ink}" stroke-width="5"/>
            <g id="${id}-inside"></g>
            <rect x="1250" y="592" width="280" height="212" rx="28" fill="${C.ink}"/>
            <rect x="1272" y="614" width="236" height="98" rx="14" fill="#0b1430" stroke="#33426b" stroke-width="3"/>
            <g id="${id}-display" font-family="Luckiest Guy" text-anchor="middle" fill="${C.yellow}"></g>
            <circle cx="1310" cy="756" r="20" fill="${C.brick}" stroke="#0b1430" stroke-width="4"/>
            <circle id="${id}-btn" cx="1390" cy="756" r="20" fill="${C.gold}" stroke="#0b1430" stroke-width="4"/>
            <circle cx="1470" cy="756" r="20" fill="${C.basil}" stroke="#0b1430" stroke-width="4"/>
            ${lid ? potLid(id) : ""}
          </g>`;
        const potLid = (id) => `
          <g id="${id}-lid">
            <rect id="${id}-pin" x="1290" y="318" width="20" height="30" rx="6" fill="${C.brick}" stroke="${C.ink}" stroke-width="5"/>
            <path d="M1142 466 Q1150 334 1390 322 Q1630 334 1638 466 Z" fill="${C.steel}" stroke="${C.ink}" stroke-width="${S}" stroke-linejoin="round"/>
            <path d="M1200 430 Q1220 362 1330 346" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity=".7"/>
            <ellipse cx="1390" cy="466" rx="262" ry="34" fill="${C.steelMid}" stroke="${C.ink}" stroke-width="${S}"/>
            <rect x="1336" y="292" width="108" height="42" rx="18" fill="${C.ink}"/>
            <rect x="1494" y="314" width="44" height="40" rx="8" fill="${C.ink}"/>
            <rect x="1502" y="300" width="28" height="18" rx="5" fill="${C.ink}"/>
          </g>`;
        const display = (id, states) =>
          ($(`#${id}-display`).innerHTML = Object.entries(states)
            .map(([k, [txt, size, on]]) => `<text class="d-${k}" x="1390" y="${663 + size * 0.36}" font-size="${size}" opacity="${on ? 1 : 0}">${txt}</text>`)
            .join(""));

        /** A plate from above, centred on (cx, cy). */
        const plate = (id, cx, cy, garnished) => {
          const spots = [[-105, -85, -12], [112, -78, 24], [-100, 100, 16], [118, 104, -20]];
          let seeds = "", onions = "";
          for (let i = 0; i < 44; i++) {
            const a = rand() * Math.PI * 2, r = 40 + rand() * 210;
            seeds += `<ellipse class="seed" cx="${(Math.cos(a) * r).toFixed(1)}" cy="${(Math.sin(a) * r).toFixed(1)}" rx="7" ry="4" transform="rotate(${(rand() * 180).toFixed(0)} ${(Math.cos(a) * r).toFixed(1)} ${(Math.sin(a) * r).toFixed(1)})" fill="#f7e7c4" stroke="${C.ink}" stroke-width="2" ${garnished ? "" : 'opacity="0"'}/>`;
          }
          for (let i = 0; i < 20; i++) {
            const a = rand() * Math.PI * 2, r = 30 + rand() * 220;
            onions += `<circle class="onion" cx="${(Math.cos(a) * r).toFixed(1)}" cy="${(Math.sin(a) * r).toFixed(1)}" r="10" fill="${C.basilSoft}" stroke="${C.basil}" stroke-width="6" ${garnished ? "" : 'opacity="0"'}/>`;
          }
          return `
          <g id="${id}-plate" transform="translate(${cx} ${cy})">
            <ellipse cx="14" cy="22" rx="372" ry="372" fill="${C.ink}" opacity=".18"/>
            <circle r="370" fill="${C.raised}" stroke="${C.ink}" stroke-width="${S + 1}"/>
            <circle r="292" fill="#fffaf0" stroke="${C.sand}" stroke-width="12"/>
            <g id="${id}-pool" ${garnished ? "" : 'opacity="0"'}><ellipse rx="230" ry="200" fill="${C.sauce}" opacity=".9"/></g>
            ${spots.map(([x, y, r], i) => `
              <g transform="translate(${x} ${y}) rotate(${r}) scale(.92)">
                <g class="pthigh" id="${id}-t${i}">
                  ${thigh("", true)}
                  <g class="glaze" ${garnished ? "" : 'opacity="0"'}>
                    <path d="M-62 -18 C -56 -54 18 -58 56 -36 C 78 -20 74 20 48 36 C 10 56 -44 52 -60 24 Z" fill="${C.glaze}" opacity=".92"/>
                    <ellipse cx="-24" cy="-26" rx="26" ry="9" fill="#fff" opacity=".6"/>
                  </g>
                </g>
              </g>`).join("")}
            <g id="${id}-seeds">${seeds}</g>
            <g id="${id}-onions">${onions}</g>
          </g>`;
        };

        const dots = (n) =>
          `<div class="dots">${Array.from({ length: 7 }, (_, i) => `<span class="dot ${i + 1 < n ? "done" : i + 1 === n ? "now" : ""}"></span>`).join("")}<span class="of">Step ${n} of 7</span></div>`;

        const frame = (id, inner) => {
          $(`#${id}`).innerHTML = `<div class="content" id="${id}-c">${inner}</div><div class="ring" id="${id}-ring"></div><div class="closer" id="${id}-close"></div>`;
        };

        const step = (id, n, title, text, art, chip = "") =>
          frame(id, `
            ${sunburst(`${id}-sun`, 1390, 560)}
            <svg class="layer" viewBox="0 0 1920 1080">${art}</svg>
            <div class="left">
              <span class="pill" id="${id}-pill" style="font-size:28px;background:${C.tealSoft};color:${C.teal}">${n === 7 ? "Last step" : `Step ${n}`}</span>

            ${dots(n)}

        // ------------------------------------------------------------ scenes
        // Card text is the recipe's own instructions, word for word.

        // open
        frame("open", `

              <span class="tag" id="open-tag">Asian</span>

            <div style="margin-top:40px">
              <div id="open-w0">${hl("HONEY", 160)}</div>
              <div id="open-w1">${hl("GARLIC", 160)}</div>
              <div id="open-w2">${hl("CHICKEN", 160)}</div>

            <div style="display:flex;gap:22px;margin-top:56px">
              <span class="pill chip" id="open-c0" style="position:static;background:${C.yellow}">Sweet</span>
              <span class="pill chip" id="open-c1" style="position:static;background:${C.brickSoft};color:${C.brick}">Sticky</span>
              <span class="pill chip" id="open-c2" style="position:static;background:${C.basilSoft};color:${C.basil}">Hands-off</span>
            </div>
          </div>
        `);

        // ingredients
        const ING = [
          ["For the sauce", C.yellow, C.gold, ["1/3 cup honey", "4 cloves garlic, minced", "1/2 cup low sodium soy sauce", "1/2 cup no salt ketchup", "1/2 teaspoon dried oregano", "2 tablespoons chopped fresh parsley"]],

        let rowIndex = 0;
        frame("ingredients", `
          ${sunburst("ing-sun", 960, 560, 3000)}

            <div class="chrome"><i style="background:${C.brick}"></i><i style="background:${C.gold}"></i><i style="background:${C.basil}"></i>

            <div style="position:absolute;left:56px;top:112px">${hl("INSTANT POT HONEY GARLIC CHICKEN", 72)}</div>
            <div style="position:absolute;left:56px;top:212px;display:flex;gap:18px;align-items:center">
              <span class="tag">Asian</span>
              <span style="font-size:30px;font-weight:600">Ingredients</span>
              <span style="font-size:28px;color:${C.muted}">· 11 things, most of them judging you from the pantry</span>
            </div>
            <div class="cols">
              ${ING.map(([name, bg, dot, rows], c) => `
                <div class="col sticker" id="ing-col${c}" style="flex:${c === 0 ? 1.3 : 1}">
                  <h3><span class="pill" style="font-size:28px;background:${bg};padding:6px 22px">${name}</span></h3>
                  ${rows.map((r) => `<div class="row" id="ing-r${rowIndex++}"><b style="background:${dot}"></b><span>${r}</span></div>`).join("")}
                </div>`).join("")}
            </div>
          </div>
        `);

        // step 1 — the sauce
        const TOKENS = [
          ["HONEY", drop(C.gold)], ["GARLIC", garlic()], ["SOY SAUCE", drop("#3b2414")],
          ["KETCHUP", drop("#c8302a")], ["OREGANO", leaves("#6b7d2e")], ["PARSLEY", leaves(C.basil)],
        ];
        const tokenX = [1180, 1265, 1350, 1430, 1515, 1600];
        step("s1", 1, "MIX THE SAUCE",
          "In a small mixing bowl combine honey, minced garlic, soy sauce, ketchup, oregano and parsley; mix until well combined and set aside.",
          `
          <g id="s1-bowl">
            <ellipse cx="1390" cy="852" rx="300" ry="26" fill="${C.ink}" opacity=".15"/>
            <ellipse cx="1390" cy="580" rx="290" ry="64" fill="${C.raised}" stroke="${C.ink}" stroke-width="${S}"/>
            <ellipse cx="1390" cy="580" rx="252" ry="46" fill="#efe6cf"/>
            <g id="s1-sauce"><ellipse cx="1390" cy="582" rx="252" ry="46" fill="${C.sauce}"/></g>
            <clipPath id="s1-in"><ellipse cx="1390" cy="582" rx="246" ry="44"/></clipPath>
            <g clip-path="url(#s1-in)"><g id="s1-swirl" opacity="0" transform="translate(1390 582) scale(1 .18)">
              <g id="s1-spiral"><path d="M0 0 C 40 -10 60 30 30 60 C -10 100 -90 70 -100 0 C -110 -80 -20 -150 80 -140 C 170 -130 220 -40 210 40" fill="none" stroke="#e8a35a" stroke-width="30" stroke-linecap="round"/></g>
            </g></g>
            <path d="M1100 580 Q1110 846 1390 852 Q1670 846 1680 580 A290 64 0 0 1 1100 580 Z" fill="${C.raised}" stroke="${C.ink}" stroke-width="${S}" stroke-linejoin="round"/>
            <path d="M1124 680 Q1390 760 1656 680" fill="none" stroke="${C.teal}" stroke-width="18"/>
            <path d="M1150 640 Q1170 760 1260 800" fill="none" stroke="${C.tealSoft}" stroke-width="14" stroke-linecap="round" opacity=".9"/>
          </g>
          ${TOKENS.map(([name, art], i) => `
            <g transform="translate(${tokenX[i]} 260)">
              <g class="s1-tok" id="s1-tok${i}">
                <g transform="scale(.95)">${art}</g>
                <g transform="translate(0 92)">
                  <rect x="${-name.length * 9.5 - 20}" y="-22" width="${name.length * 19 + 40}" height="44" rx="22" fill="${C.raised}" stroke="${C.ink}" stroke-width="5"/>
                  <text y="10" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="24" letter-spacing="1.5" fill="${C.ink}">${name}</text>
                </g>
              </g>
            </g>`).join("")}
          <g transform="translate(1440 480)"><g id="s1-whisk">
            <g id="s1-whiskI">
              <rect x="-14" y="-300" width="28" height="170" rx="12" fill="${C.brick}" stroke="${C.ink}" stroke-width="6"/>
              <path d="M-10 -130 C -70 -40 -50 120 0 130 C 50 120 70 -40 10 -130" fill="none" stroke="${C.ink}" stroke-width="8"/>
              <path d="M-4 -130 C -36 -40 -26 110 0 120 C 26 110 36 -40 4 -130" fill="none" stroke="${C.ink}" stroke-width="7"/>
            </g>
          </g></g>`);
        // the stamp
        $("#s1-c").insertAdjacentHTML("beforeend", `<div class="stamp" id="s1-stamp" style="left:1290px;top:170px;font-size:62px;color:${C.basil};background:${C.basilSoft};border-color:${C.basil}">BOWL: APPROVED</div>`);

        // step 2 — sauté and oil
        step("s2", 2, "HEAT IT UP", "Heat the Instant Pot in sauté mode. Add sesame oil to the pot.",
          `
          ${pot("s2")}
          <g id="s2-heat" opacity="0">
            ${[1300, 1390, 1480].map((x, i) => `<path class="s2-wave" d="M${x} 430 q -20 -30 0 -60 q 20 -30 0 -60" fill="none" stroke="${C.brick}" stroke-width="10" stroke-linecap="round"/>`).join("")}
          </g>
          <g transform="translate(1690 270)">
            <g id="s2-bottle">
              <rect x="-18" y="-150" width="36" height="60" rx="8" fill="#d79a32" stroke="${C.ink}" stroke-width="6"/>
              <rect x="-24" y="-176" width="48" height="30" rx="8" fill="${C.ink}"/>
              <rect x="-56" y="-96" width="112" height="210" rx="34" fill="#e3a63d" stroke="${C.ink}" stroke-width="${S}"/>
              <rect x="-44" y="-30" width="88" height="86" rx="12" fill="${C.raised}" stroke="${C.ink}" stroke-width="5"/>

          </g>
          ${[0, 1, 2].map((i) => `<g transform="translate(${1440 - i * 30} ${330})"><g class="s2-drip"><path d="M0 -16 C 8 -6 13 1 13 7 A13 13 0 0 1 -13 7 C -13 1 -8 -6 0 -16 Z" fill="${C.gold}" stroke="${C.ink}" stroke-width="4"/></g></g>`).join("")}`,

        // step 3 — season and brown

        step("s3", 3, "BROWN THE CHICKEN",
          "Season chicken thighs with salt and pepper; arrange in the instant pot and cook for about 2 to 3 minutes per side.",
          `
          <g transform="translate(1390 580)">

        $("#s6-c").insertAdjacentHTML("beforeend", `<div class="stamp" id="s6-stamp" style="left:1490px;top:150px;font-size:66px;color:${C.basil};background:${C.basilSoft};border-color:${C.basil}">READY</div>`);
        display("s6", { done: ["00:00", 60, true], off: ["OFF", 58] });

        // step 7 — plate up
        step("s7", 7, "PLATE IT UP",

          plate("s7", 1390, 560, false));
        $("#s7-c .layer").insertAdjacentHTML("beforeend", `
          <g transform="translate(1745 300)"><g id="s7-ranch">

        // close
        frame("close", `

        $("#bubbles").innerHTML = B.quips.map(([, , text], i) => `<div class="bubble" id="quip${i}">${text}</div>`).join("");

        // ------------------------------------------------------------ motion
        // Springfield Kitchen's motion.md: entrances overshoot and settle,
        // presses are quick, loops are linear. Nothing eases in-and-out.

        const tl = gsap.timeline({ paused: true });
        const LAND = "back.out(1.9)";
        const SLAM = "elastic.out(1, 0.45)";

        const pop = (el, at, dur = 0.5) => tl.fromTo(el, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: dur, ease: LAND }, at);
        const popFrom = (el, at, origin) => tl.fromTo(el, { scale: 0, transformOrigin: origin }, { scale: 1, duration: 0.5, ease: LAND }, at);
        const slam = (el, at, origin = "0% 60%") => {
          tl.fromTo(el, { scale: 1.6, opacity: 0, transformOrigin: origin }, { scale: 1, opacity: 1, duration: 0.55, ease: SLAM }, at);

        /** Falls on gravity, lands at `at`, squashes and rings out. Bottom-anchored. */
        const fall = (el, at, h = 760, fallDur = 0.36) => {

        };
        const bob = (el, from, to, px = 9, period = 3.6) => {
          const n = Math.max(1, Math.floor((to - from) / (period / 2)));

        };
        const show = (sel, at) => tl.set(sel, { opacity: 1 }, at);
        const hide = (sel, at) => tl.set(sel, { opacity: 0 }, at);
        const swap = (id, from, to, at) => { hide(`#${id}-display .d-${from}`, at); show(`#${id}-display .d-${to}`, at); };
        const press = (el, at) => tl.fromTo(el, { scale: 1, transformOrigin: "50% 50%" }, { scale: 0.8, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);

        // Every scene: the iris opens on yellow, the sunburst turns, a yellow

          if (i > 0) {

            tl.set(`#${id}-ring`, { opacity: 0 }, 0);
            tl.fromTo(`#${id}-ring`, { width: 0, height: 0, opacity: 1 }, { width: 2524, height: 2524, duration: 0.42, ease: "power3.out" }, start);

            tl.set(`#${id}-close`, { opacity: 0 }, 0);
          }
          const sun = document.getElementById(SUN[id]);
          if (sun) tl.fromTo(sun, { rotation: 0 }, { rotation: -6, duration: 0.25, ease: "sine.out" }, start)
                     .to(sun, { rotation: -6 + (end - start) * 5, duration: end - start - 0.25, ease: "none" }, start + 0.25);
        });

        // steps share an entrance: pill, title, card
        for (const s of ["s1", "s2", "s3", "s4", "s5", "s6", "s7"]) {

          tl.fromTo("#s1-stamp", { scale: 2.2, opacity: 0, rotation: -10 }, { scale: 1, opacity: 1, rotation: -8, duration: 0.45, ease: SLAM }, B.s1Aside + 0.05);

        tl.to("#s2-oil", { opacity: 1, duration: 0.4 }, B.s2Oil + 0.8);

        swap("s2", "saute", "hot", B.s2Hot);

        $$(".s3-thigh").forEach((t, i) => fall(t, B.s3Thighs + i * 0.1, 520, 0.3));
        ["#s3-salt", "#s3-pepper"].forEach((s, i) => {
          popFrom(s, B.s3Season - 0.35 + i * 0.1, "50% 100%");

          tl.to(s, { y: 60, duration: 0.11, ease: "sine.inOut", yoyo: true, repeat: 7 }, B.s3Season + 0.25);

        tl.to("#s4-bowl", { rotation: -52, transformOrigin: "50% 50%", duration: 0.25, ease: LAND }, B.s4Pour + 0.15);
        tl.fromTo("#s4-stream", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.2, ease: "power2.in" }, B.s4Pour + 0.3);
        tl.fromTo("#s4-fill", { scale: 0.1, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.5, ease: "power1.out" }, B.s4Pour + 0.4);
        tl.to("#s4-stream", { scaleY: 0, transformOrigin: "50% 100%", duration: 0.15, ease: "power2.out" }, B.s4Lid - 0.32);
        tl.to("#s4-bowl", { rotation: 0, y: -400, duration: 0.3, ease: "power2.in" }, B.s4Lid - 0.32);
        tl.fromTo("#s4-lid", { y: -800 }, { y: 0, duration: 0.36, ease: "power2.in", immediateRender: false }, B.s4Lid - 0.36);
        tl.fromTo("#s4-pot", { scaleX: 1.08, scaleY: 0.92, transformOrigin: "50% 100%" }, { scaleX: 1, scaleY: 1, duration: 0.6, ease: "elastic.out(1, 0.35)", immediateRender: false }, B.s4Lid);
        swap("s4", "off", "lock", B.s4Lock);
        tl.fromTo("#s4-lid", { rotation: 0, svgOrigin: "1390 466" }, { rotation: 4, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, B.s4Lock - 0.1);
        popFrom("#s4-lock", B.s4Lock, "0% 50%");

        // ---- step 5: poultry, 20 minutes, count down
        popFrom("#s5-pot", TL.scenes.s5.start + 0.2, "50% 100%");
        press("#s5-btn", B.s5Poultry - 0.1);
        swap("s5", "lock", "poultry", B.s5Poultry);
        hide("#s5-display .d-poultry", B.s5Twenty);
        show("#s5-strip", B.s5Twenty);
        popFrom("#s5-chip", B.s5Twenty, "50% 50%");
        tl.to("#s5-pin", { y: -16, duration: 0.3, ease: LAND }, B.s5Count - 0.2);
        tl.to("#s5-strip", { y: -20 * 98, duration: B.s5Done - B.s5Count, ease: "steps(20)" }, B.s5Count);
        tl.fromTo("#s5-ring", { opacity: 1, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 0, scale: 1.4, duration: 0.6, ease: "power2.out" }, B.s5Done);
        tl.fromTo("#s5-display", { opacity: 1 }, { opacity: 0.3, duration: 0.15, yoyo: true, repeat: 3, ease: "none", immediateRender: false }, B.s5Done);

        // ---- step 6: off, steam, ready
        tl.set("#s6-pin", { y: -16 }, 0);
        popFrom("#s6-pot", TL.scenes.s6.start + 0.15, "50% 100%");
        press("#s6-btn", B.s6Off - 0.1);
        swap("s6", "done", "off", B.s6Off);
        {
          const from = B.s6Steam, until = B.s6Ready - 0.3;
          $$(".s6-puff").forEach((p, i) => {
            const t = from + i * ((until - from) / 12);
            const k = 1 - i / 14; // the venting tails off
            tl.fromTo(p, { opacity: 0, x: 0, y: 0, scale: 0.3, transformOrigin: "50% 50%" },
              { opacity: 1, scale: 0.6 + 0.8 * k, x: 50 + (i % 3) * 30, y: -150 * k - 50, duration: 0.5, ease: "power2.out" }, t);
            tl.to(p, { opacity: 0, y: `-=${60}`, duration: 0.6, ease: "power1.in" }, t + 0.5);
          });
        }
        popFrom("#s6-clock", B.s6Clock, "0% 50%");
        tl.fromTo("#s6-hand", { rotation: 0, svgOrigin: "0 0" }, { rotation: 360, duration: B.s6Ready - B.s6Clock, ease: "none" }, B.s6Clock);
        tl.to("#s6-pin", { y: 0, duration: 0.2, ease: "power2.in" }, B.s6Ready - 0.15);
        tl.fromTo("#s6-denied", { scale: 2.4, opacity: 0, rotation: 4 }, { scale: 1, opacity: 1, rotation: -9, duration: 0.45, ease: SLAM }, B.s6Denied);
        tl.to("#s6-denied", { scale: 0, opacity: 0, duration: 0.2, ease: "back.in(2)" }, B.s6Ready - 0.2);
        tl.fromTo("#s6-stamp", { scale: 2.2, opacity: 0, rotation: -10 }, { scale: 1, opacity: 1, rotation: 6, duration: 0.45, ease: SLAM }, B.s6Ready);

        // ---- step 7: chicken, sauce, seeds, onions, served
        popFrom("#s7-plate", TL.scenes.s7.start + 0.15, "50% 50%");
        $$("#s7 .pthigh").forEach((t, i) => fall(t, B.s7Plate + 0.3 + i * 0.13, 500, 0.3));
        tl.fromTo("#s7-pool", { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.6, ease: LAND }, B.s7Sauce);
        $$("#s7 .glaze").forEach((g, i) => tl.fromTo(g, { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: LAND }, B.s7Sauce + 0.15 + i * 0.12));
        $$("#s7 .seed").forEach((s, i) => tl.fromTo(s, { opacity: 0, y: -50 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.in" }, B.s7Seeds + (i % 22) * 0.035));
        $$("#s7 .onion").forEach((s, i) => tl.fromTo(s, { opacity: 0, scale: 2.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: SLAM }, B.s7Onions + i * 0.05));
        fall("#s7-ranch", B.s7Ranch + 0.1, 700, 0.3);
        tl.fromTo("#s7-denied", { scale: 2.4, opacity: 0, rotation: 6 }, { scale: 1, opacity: 1, rotation: -10, duration: 0.45, ease: SLAM }, B.s7Denied);
        tl.to("#s7-ranch", { x: 500, rotation: 40, duration: 0.45, ease: "power2.in" }, B.s7Denied + 0.65);
        tl.to("#s7-denied", { x: 500, rotation: 20, duration: 0.45, ease: "power2.in" }, B.s7Denied + 0.65);
        tl.fromTo("#s7-stamp", { scale: 2.2, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: -6, duration: 0.45, ease: SLAM }, B.s7Stamp);

        // ---- close
        fall("#close-panel", B.closePanel, 1000);
        bob("#close-panel", B.closePanel + 0.8, TL.scenes.close.end);
        popFrom("#close-eyebrow", TL.scenes.close.start + 0.6, "0% 50%");
        slam("#close-title", B.closeTitle);
        tl.fromTo("#close-sub", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: LAND }, B.closeTitle + 0.7);
        tl.fromTo("#close-placard", { scale: 2.4, opacity: 0, rotation: -8, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, rotation: -3, duration: 0.6, ease: SLAM }, B.closeSlam);
        tl.fromTo("#close-credit", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "none" }, B.closeCredit);

        // ---- the host and his asides
        popFrom("#host", B.hostIn, "0% 100%");
        tl.to("#host", { scale: 0, duration: 0.3, ease: "back.in(2)" }, B.hostOut);
        B.quips.forEach(([scene, t], i) => {
          popFrom(`#quip${i}`, t, "0% 100%");
          tl.to(`#quip${i}`, { scale: 0, duration: 0.2, ease: "back.in(2)" }, TL.scenes[scene].end - 0.4);
        });

        // hold the timeline open to the last frame
        tl.set({}, {}, TL.total);

        window.__timelines = window.__timelines || {};
        window.__timelines["root"] = tl;
      })();
    </script>
  </body>
</html>
